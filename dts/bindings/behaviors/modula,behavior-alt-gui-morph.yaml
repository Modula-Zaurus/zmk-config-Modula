description: Select one of two encoded keycodes when Alt or GUI is held

compatible: "modula,behavior-alt-gui-morph"

include: two_param.yaml

properties:
  mods:
    type: int
    required: true
    description: Modifier flags that select the second keycode.
  keep-mods:
    type: int
    required: false
    description: Modifier flags that remain active while the second keycode is sent.
